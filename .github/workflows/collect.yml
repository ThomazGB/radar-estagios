name: Daily job collection

on:
  schedule:
    - cron: "0 10 * * *" # every day at 10:00 UTC (07:00 in Brasília)
  workflow_dispatch: # also allows running it by hand from the Actions tab

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m etl.pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }} # Neon connection string, stored as a repo secret

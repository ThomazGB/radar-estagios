# Render Blueprint for the API (free plan). DATABASE_URL and ALLOWED_ORIGINS are set in the dashboard.
services:
  - type: web
    name: radar-estagios-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
